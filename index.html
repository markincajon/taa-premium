
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">

  <title>Marcus.INK | Premium Tattoo Artist Dublin</title>
  <meta name="description" content="Discover custom tattoo art by Marcus.INK in Dublin. Explore the portfolio and enquire about your next tattoo project.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #090909;
      --surface: #111111;
      --surface-light: #191919;
      --white: #f4f2ee;
      --muted: #999999;
      --accent: #c64a43;
      --line: rgba(255,255,255,.10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    body, button, input, textarea, select {
      font-family: 'DM Sans', sans-serif;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    a { text-decoration: none; color: inherit; }

    .font-art {
      font-family: 'Playfair Display', serif;
    }

    .accent { color: var(--accent); }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .32em;
      color: var(--accent);
      font-weight: 700;
    }

    .section-title {
      font-size: clamp(36px, 6vw, 68px);
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 700;
    }

    .container-main {
      width: min(1200px, calc(100% - 48px));
      margin: auto;
    }

    /* NAVIGATION */

    .navbar {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .brand span { color: var(--accent); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 35px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #c5c5c5;
    }

    .nav-links a:hover { color: white; }

    .nav-cta {
      padding: 13px 22px;
      border: 1px solid rgba(255,255,255,.35);
      transition: .3s;
    }

    .nav-cta:hover {
      background: white;
      color: black;
    }

    /* HERO */

    .hero {
      min-height: 850px;
      height: 100svh;
      max-height: 1050px;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 160px 8% 100px;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,.88) 0%,
          rgba(0,0,0,.55) 43%,
          rgba(0,0,0,.12) 100%),
        linear-gradient(to top,
          var(--bg) 0%,
          transparent 38%),
        url('IMG_20261109_004046.jpg') center 25% / cover no-repeat;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 760px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .2em;
      margin-bottom: 28px;
    }

    .hero-tag::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .hero h1 {
      font-size: clamp(52px, 8vw, 105px);
      line-height: .99;
      letter-spacing: -.06em;
      margin: 0 0 28px;
      font-weight: 800;
    }

    .hero h1 em {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      color: #c7c3bd;
    }

    .hero-description {
      max-width: 510px;
      color: #c4c4c4;
      font-size: 14px;
      line-height: 1.9;
      margin-bottom: 38px;
    }

    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 17px 30px;
      background: var(--white);
      color: #090909;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      transition: .3s;
    }

    .primary-button:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-3px);
    }

    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 17px 30px;
      border: 1px solid rgba(255,255,255,.35);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: .3s;
    }

    .secondary-button:hover {
      border-color: white;
      background: rgba(255,255,255,.08);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-bottom {
      position: absolute;
      bottom: 38px;
      right: 6%;
      font-size: 9px;
      letter-spacing: .25em;
      color: #999;
      text-transform: uppercase;
    }

    /* ARTIST INTRO */

    .artist-section {
      padding: 130px 0;
      background: var(--bg);
    }

    .artist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 90px;
      align-items: center;
    }

    .artist-photo {
      min-height: 570px;
      position: relative;
      overflow: hidden;
      background: #171717;
    }

    .artist-photo img {
      width: 100%;
      height: 100%;
      min-height: 570px;
      object-fit: cover;
      display: block;
    }

    .artist-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.12);
      pointer-events: none;
    }

    .artist-copy p {
      font-size: 14px;
      line-height: 2;
      color: var(--muted);
      margin: 25px 0;
    }

    .artist-signature {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 28px;
      color: #ddd;
      margin-top: 35px;
    }

    /* PORTFOLIO */

    .portfolio-section {
      padding: 120px 0;
      background: #101010;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 55px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .portfolio-card {
      position: relative;
      min-height: 380px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 30%, #383838, #151515 70%);
    }

    .portfolio-card img {
      width: 100%;
      height: 100%;
      min-height: 380px;
      object-fit: cover;
      display: block;
      transition: transform .7s ease;
    }

    .portfolio-card:hover img { transform: scale(1.06); }

    .portfolio-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 25px;
      background: linear-gradient(transparent 40%, rgba(0,0,0,.8));
      pointer-events: none;
    }

    .portfolio-overlay h3 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .portfolio-overlay span {
      font-size: 9px;
      letter-spacing: .2em;
      color: #ccc;
      text-transform: uppercase;
    }

    /* STYLES */

    .styles-section {
      padding: 120px 0;
    }

    .styles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-top: 55px;
    }

    .style-item {
      padding: 40px 22px;
      border-right: 1px solid var(--line);
      transition: .3s;
    }

    .style-item:last-child { border-right: 0; }

    .style-item:hover {
      background: #151515;
    }

    .style-number {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: .2em;
    }

    .style-item h3 {
      margin-top: 28px;
      font-size: 19px;
      font-weight: 700;
    }

    .style-item p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
      margin-top: 12px;
    }

    /* EXPERIENCE */

    .experience-section {
      padding: 120px 0;
      background: #111;
    }

    .experience-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .experience-image {
      height: 550px;
      overflow: hidden;
      background: #222;
    }

    .experience-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .experience-copy p {
      color: var(--muted);
      font-size: 14px;
      line-height: 2;
      margin: 25px 0;
    }

    .experience-point {
      display: flex;
      gap: 18px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
    }

    .experience-point span {
      color: var(--accent);
      font-size: 11px;
    }

    .experience-point strong {
      font-size: 12px;
      letter-spacing: .05em;
    }

    /* BOOKING */

    .booking-section {
      padding: 130px 0;
    }

    .booking-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 100px;
    }

    .booking-copy p {
      color: var(--muted);
      font-size: 14px;
      line-height: 2;
      margin-top: 25px;
    }

    .booking-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-field.full { grid-column: 1 / -1; }

    .form-field label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: #aaa;
    }

    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      padding: 15px;
      border: 1px solid var(--line);
      outline: none;
      background: #121212;
      color: white;
      font-size: 12px;
      border-radius: 0;
    }

    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--accent);
    }

    .form-field textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-field select option { background: #111; }

    /* FOOTER */

    footer {
      padding: 50px 0;
      border-top: 1px solid var(--line);
      background: #080808;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }

    .footer-copy {
      font-size: 10px;
      color: #777;
      letter-spacing: .12em;
    }

    /* AVATAR WIDGET */

    #avatar-widget {
      position: fixed;
      z-index: 9999;
      right: 25px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 175px;
      touch-action: none;
      user-select: none;
    }

    #avatar-bubble {
      position: relative;
      max-width: 230px;
      margin-bottom: 10px;
      padding: 14px 17px;
      background: rgba(22,22,22,.96);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 15px 15px 3px 15px;
      color: white;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.6;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
      backdrop-filter: blur(15px);
      animation: bubbleIn .5s ease both;
      cursor: pointer;
    }

    #avatar-bubble::after {
      content: '';
      position: absolute;
      right: 14px;
      bottom: -6px;
      width: 10px;
      height: 10px;
      background: #161616;
      border-right: 1px solid rgba(255,255,255,.16);
      border-bottom: 1px solid rgba(255,255,255,.16);
      transform: rotate(45deg);
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #avatar-button {
      position: relative;
      display: block;
      width: 155px;
      height: 230px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
    }

    #avatar-button:active { cursor: grabbing; }

    #avatar-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transform-origin: 50% 85%;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.65));
      pointer-events: none;
      animation: breathe 3.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.012); }
    }

    /* Saudações: movimento suave do personagem inteiro.
       Para braços articulados, será necessário rigging ou imagens em camadas. */

    #avatar-image.wave {
      animation: waveBody .8s ease-in-out;
    }

    @keyframes waveBody {
      0% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-4deg) translateY(-5px); }
      50% { transform: rotate(4deg) translateY(-7px); }
      75% { transform: rotate(-3deg) translateY(-3px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    #avatar-image.point {
      animation: pointBody 1s ease-in-out;
    }

    @keyframes pointBody {
      0% { transform: translateY(0) scale(1); }
      20% { transform: translateY(-8px) scale(1.04) rotate(-2deg); }
      40% { transform: translateY(0) scale(1.01) rotate(2deg); }
      60% { transform: translateY(-6px) scale(1.04) rotate(-2deg); }
      80% { transform: translateY(0) scale(1.01) rotate(1deg); }
      100% { transform: translateY(0) scale(1); }
    }

    .avatar-status {
      position: absolute;
      bottom: 20px;
      right: 12px;
      width: 13px;
      height: 13px;
      border: 2px solid #090909;
      border-radius: 50%;
      background: #40d67b;
      box-shadow: 0 0 12px rgba(64,214,123,.6);
      pointer-events: none;
    }

    /* CHAT */

    #chat-window {
      position: absolute;
      right: 0;
      bottom: 265px;
      width: min(340px, calc(100vw - 35px));
      background: #111;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.65);
      display: none;
      flex-direction: column;
      touch-action: pan-y;
      user-select: text;
    }

    #chat-window.open {
      display: flex;
      animation: chatIn .25s ease both;
    }

    @keyframes chatIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-header {
      padding: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #191919;
      border-bottom: 1px solid var(--line);
    }

    .chat-title {
      font-size: 12px;
      font-weight: 800;
    }

    .chat-online {
      margin-top: 5px;
      font-size: 9px;
      color: #50d58a;
    }

    .chat-close {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
    }

    .chat-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
    }

    .chat-message {
      padding: 12px;
      border-radius: 3px 12px 12px 12px;
      background: #242424;
      color: #e5e5e5;
      font-size: 11px;
      line-height: 1.7;
      max-width: 95%;
    }

    .chat-option {
      text-align: left;
      padding: 12px;
      border: 1px solid #353535;
      background: transparent;
      color: #ddd;
      font-size: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .chat-option:hover {
      background: #222;
      border-color: var(--accent);
    }

    .chat-response {
      display: none;
      padding: 12px;
      background: #202020;
      border-left: 2px solid var(--accent);
      color: #ddd;
      font-size: 11px;
      line-height: 1.7;
    }

    .chat-footer {
      padding: 14px;
      border-top: 1px solid var(--line);
    }

    .chat-footer a {
      display: block;
      text-align: center;
      padding: 13px;
      background: white;
      color: black;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    /* MOBILE */

    @media(max-width: 850px) {
      .nav-links { gap: 17px; }
      .nav-links a:not(.nav-cta) { display: none; }

      .hero {
        min-height: 760px;
        padding: 150px 7% 100px;
        background-position: 58% center;
      }

      .artist-grid,
      .experience-grid,
      .booking-grid {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .artist-photo { min-height: 430px; }
      .artist-photo img { min-height: 430px; }

      .portfolio-grid { grid-template-columns: repeat(2,1fr); }

      .styles-grid { grid-template-columns: repeat(2,1fr); }

      .style-item:nth-child(2) { border-right: 0; }

      .style-item:nth-child(-n+2) {
        border-bottom: 1px solid var(--line);
      }

      .experience-image { height: 430px; }
      .booking-grid { gap: 30px; }
    }

    @media(max-width: 520px) {
      .container-main { width: calc(100% - 36px); }

      .navbar {
        padding: 22px 20px;
      }

      .brand { font-size: 18px; }

      .nav-cta {
        padding: 11px 13px;
        font-size: 8px;
      }

      .hero {
        min-height: 750px;
        height: 92svh;
        padding: 130px 22px 100px;
        background-position: 59% center;
      }

      .hero h1 { font-size: 55px; }

      .hero-description {
        font-size: 12px;
        max-width: 320px;
      }

      .hero-bottom { display: none; }

      .section-header {
        display: block;
      }

      .artist-section,
      .portfolio-section,
      .styles-section,
      .experience-section,
      .booking-section {
        padding: 85px 0;
      }

      .portfolio-grid { grid-template-columns: 1fr 1fr; gap: 9px; }

      .portfolio-card,
      .portfolio-card img { min-height: 240px; }

      .portfolio-overlay { padding: 12px; }
      .portfolio-overlay h3 { font-size: 12px; }

      .portfolio-overlay span { font-size: 8px; }

      .booking-form { grid-template-columns: 1fr; }

      .form-field.full { grid-column: auto; }

      .footer-content {
        flex-direction: column;
        align-items: flex-start;
      }

      #avatar-widget {
        right: 10px;
        bottom: 8px;
        width: 115px;
      }

      #avatar-button {
        width: 105px;
        height: 158px;
      }

      #avatar-bubble {
        max-width: 185px;
        font-size: 10px;
        padding: 11px 13px;
      }

      #chat-window {
        bottom: 180px;
        right: 0;
      }
    }

    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav class="navbar">
    <a href="#" class="brand">MARCUS<span>.INK</span></a>

    <div class="nav-links">
      <a href="#artist">The Artist</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#styles">Styles</a>
      <a href="#booking" class="nav-cta">Enquire Now</a>
    </div>
  </nav>

  <!-- HERO -->

  <header class="hero">
    <div class="hero-content">

      <div class="hero-tag">Custom T
